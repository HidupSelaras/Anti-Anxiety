<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog & Edukasi - Anti Anxiety</title>
    <meta name="description" content="Kumpulan artikel edukasi seputar kecemasan, latihan napas, grounding, dan kesehatan mental.">

    <!-- ============================================================
         DARK MODE INIT — HARUS PALING AWAL
         ============================================================ -->
    <script>
    (function () {
        try {
            var KEY = 'aa_theme';
            var saved = localStorage.getItem(KEY);

            if (saved === null) {
                var legacy = localStorage.getItem('anti_anxiety_theme') || localStorage.getItem('theme');
                if (legacy === 'dark' || legacy === 'light') {
                    saved = legacy;
                    try { localStorage.setItem(KEY, legacy); } catch (e) {}
                }
            }

            var shouldBeDark;
            if (saved === 'dark') shouldBeDark = true;
            else if (saved === 'light') shouldBeDark = false;
            else shouldBeDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (shouldBeDark) document.documentElement.classList.add('dark');
        } catch (e) {}
    })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { calm: { 500: '#14b8a6', 600: '#0d9488' } } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #eaf5ef; background-image: linear-gradient(180deg, rgba(232, 246, 240, 0.6) 0%, rgba(214, 236, 226, 0.7) 100%), url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2000&q=85'); background-size: cover; background-position: center; background-attachment: fixed; }
        html.dark body { background-color: #0a1b17; background-image: linear-gradient(180deg, rgba(10, 27, 24, 0.8) 0%, rgba(12, 35, 30, 0.9) 100%), url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=2000&q=85'); }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-100 min-h-screen flex flex-col">

    <header class="sticky top-0 z-30 backdrop-blur-md bg-white/70 dark:bg-slate-900/70 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-calm-400 to-teal-200 flex items-center justify-center text-teal-900">
                    <i data-lucide="heart-handshake" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold bg-gradient-to-r from-teal-700 to-emerald-600 dark:from-teal-300 dark:to-emerald-400 bg-clip-text text-transparent">Anti Anxiety</h1>
                </div>
            </a>
            <div class="flex items-center gap-2">
                <button onclick="toggleDarkMode()" aria-label="Ganti mode gelap" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition">
                    <i data-lucide="moon" id="themeIcon" class="w-5 h-5"></i>
                </button>
                <a href="index.html" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-sm font-bold flex items-center gap-1.5 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10 flex-1 w-full">
        <div class="text-center mb-10">
            <span class="px-3 py-1 bg-calm-100 dark:bg-calm-900/50 text-calm-700 dark:text-calm-300 text-xs font-bold rounded-full">Ruang Edukasi</span>
            <h2 class="text-3xl font-bold mt-2 text-slate-800 dark:text-slate-100">Artikel & Panduan</h2>
            <p class="text-sm text-slate-600 dark:text-slate-400 mt-2">Pelajari lebih lanjut tentang kecemasan dan cara mengelolanya.</p>
        </div>

        <!-- Container ini akan diisi otomatis oleh JavaScript dari blog.json -->
        <div id="daftar-blog" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Teks loading awal -->
            <p class="text-center col-span-full text-slate-500 dark:text-slate-400 animate-pulse">Memuat daftar artikel...</p>
        </div>
    </main>

    <footer class="py-6 text-center text-xs text-slate-500 dark:text-slate-400 border-t border-slate-200 dark:border-slate-800">
        <p>© 2026 Anti Anxiety App.</p>
    </footer>

    <script>
        // 1. Inisialisasi Ikon Lucide
        lucide.createIcons();

        // 2. Logika Dark Mode
        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if (!icon) return;
            const isDark = document.documentElement.classList.contains('dark');
            icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
            lucide.createIcons();
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const isDark = !html.classList.contains('dark');
            html.classList.toggle('dark', isDark);
            try { localStorage.setItem('aa_theme', isDark ? 'dark' : 'light'); } catch (e) {}
            updateThemeIcon();
        }

        window.addEventListener('storage', function (e) {
            if (e.key === 'aa_theme') {
                const isDark = e.newValue === 'dark';
                document.documentElement.classList.toggle('dark', isDark);
                updateThemeIcon();
            }
        });

        window.addEventListener('DOMContentLoaded', updateThemeIcon);

        // 3. Logika Memuat Daftar Artikel dari blog.json
        async function muatDaftarBlog() {
            try {
                // Mengambil data dari file blog.json
                const response = await fetch('blog.json');
                if (!response.ok) throw new Error('File blog.json tidak ditemukan');
                
                const dataBlog = await response.json();
                const container = document.getElementById('daftar-blog');
                
                let htmlContent = '';
                
                // Looping data artikel
                dataBlog.forEach(artikel => {
                    // Pemetaan warna teks kategori berdasarkan isi file JSON
                    let warnaTeks = 'text-calm-600 dark:text-calm-400'; // default
                    if(artikel.warna === 'sky') warnaTeks = 'text-sky-600 dark:text-sky-400';
                    if(artikel.warna === 'teal') warnaTeks = 'text-teal-600 dark:text-teal-400';
                    if(artikel.warna === 'pink') warnaTeks = 'text-pink-600 dark:text-pink-400';
                    if(artikel.warna === 'emerald') warnaTeks = 'text-emerald-600 dark:text-emerald-400';
                    if(artikel.warna === 'indigo') warnaTeks = 'text-indigo-600 dark:text-indigo-400';
                    if(artikel.warna === 'purple') warnaTeks = 'text-purple-600 dark:text-purple-400';

                    // Membuat desain kartu (sama persis dengan aslinya)
                    htmlContent += `
                        <a href="${artikel.link}" class="bg-white/90 dark:bg-slate-800/90 rounded-3xl p-6 shadow-sm hover:shadow-md hover:-translate-y-1 transition backdrop-blur-sm border border-slate-200/60 dark:border-slate-700/60">
                            <span class="text-[10px] font-bold ${warnaTeks} uppercase mb-2 block">${artikel.kategori}</span>
                            <h3 class="text-base font-bold text-slate-800 dark:text-slate-100">${artikel.judul}</h3>
                        </a>
                    `;
                });
                
                // Tampilkan ke layar
                container.innerHTML = htmlContent;
            } catch (error) {
                console.error("Gagal memuat blog:", error);
                document.getElementById('daftar-blog').innerHTML = `
                    <div class="col-span-full text-center py-10">
                        <p class="text-red-500 font-bold mb-2">Gagal memuat artikel.</p>
                        <p class="text-sm text-slate-500">Pastikan file blog.json sudah diunggah dengan benar.</p>
                    </div>
                `;
            }
        }

        // Jalankan fungsi memuat blog saat halaman dibuka
        muatDaftarBlog();
    </script>
</body>
</html>
